# This file is generated by scripts/generate-automation.js from automation-registry.yml.
# Do not edit it by hand - edit the registry and run:
#   node scripts/generate-automation.js
#
# Reusable workflow: one job per automation, or per group of automations sharing trigger events,
# gated on the original triggering event/action.
name: Automation
on:
  workflow_call:
    secrets:
      CONTRIBUTIONS_SHEET_NAME:
        description: "Forwarded to: update-pr-spreadsheet"
        required: false
      CONTRIBUTIONS_SPREADSHEET_ID:
        description: "Forwarded to: update-pr-spreadsheet"
        required: false
      GH_UPLOADER_GCP_SA_CREDENTIALS:
        description: "Forwarded to: update-pr-spreadsheet"
        required: false
      LE_BOT_APP_ID:
        description: "Forwarded to: review-requested, pull-request-label, dependabot-reviewer, contributor-pr-reply, issue-open, issue-label-header, good-first-issue-comment, update-pr-spreadsheet, community-contribution-label, contributor-issue-comment, unassign-inactive-issues"
        required: true
      LE_BOT_PRIVATE_KEY:
        description: "Forwarded to: review-requested, pull-request-label, dependabot-reviewer, contributor-pr-reply, issue-open, issue-label-header, good-first-issue-comment, update-pr-spreadsheet, community-contribution-label, contributor-issue-comment, unassign-inactive-issues"
        required: true
      SLACK_COMMUNITY_NOTIFICATIONS_WEBHOOK_URL:
        description: "Forwarded to: contributor-pr-reply, contributor-issue-comment, unassign-inactive-issues"
        required: false
      SLACK_WEBHOOK_URL:
        description: "Forwarded to: contributor-issue-comment"
        required: false
jobs:
  pull-request-target:
    name: Pull Request Target
    if: ${{ (github.event_name == 'pull_request_target' && github.event.action == 'review_requested') || (github.event_name == 'pull_request_target' && github.event.action == 'labeled') || (github.event_name == 'pull_request_target' && github.event.action == 'opened' && github.event.pull_request.user.login == 'dependabot[bot]') || (github.event_name == 'pull_request_target' && github.event.action == 'opened') || (github.event_name == 'pull_request_target' && contains(fromJSON('["assigned","unassigned","opened","closed","reopened","edited","review_requested","review_request_removed"]'), github.event.action)) }}
    uses: learningequality/.github/.github/workflows/automation-group-pull-request-target.yml@main
    permissions:
      contents: read
    secrets:
      CONTRIBUTIONS_SHEET_NAME: ${{ secrets.CONTRIBUTIONS_SHEET_NAME }}
      CONTRIBUTIONS_SPREADSHEET_ID: ${{ secrets.CONTRIBUTIONS_SPREADSHEET_ID }}
      GH_UPLOADER_GCP_SA_CREDENTIALS: ${{ secrets.GH_UPLOADER_GCP_SA_CREDENTIALS }}
      LE_BOT_APP_ID: ${{ secrets.LE_BOT_APP_ID }}
      LE_BOT_PRIVATE_KEY: ${{ secrets.LE_BOT_PRIVATE_KEY }}
      SLACK_COMMUNITY_NOTIFICATIONS_WEBHOOK_URL: ${{ secrets.SLACK_COMMUNITY_NOTIFICATIONS_WEBHOOK_URL }}
  issues:
    name: Issues
    if: ${{ (github.event_name == 'issues' && contains(fromJSON('["opened","reopened"]'), github.event.action)) || (github.event_name == 'issues' && contains(fromJSON('["labeled","unlabeled"]'), github.event.action) && github.event.label.name == 'help wanted') || (github.event_name == 'issues' && github.event.action == 'labeled' && (github.event.label.name == 'good first issue' || github.event.label.name == 'help wanted')) || (github.event_name == 'issues' && contains(fromJSON('["assigned","unassigned"]'), github.event.action)) }}
    uses: learningequality/.github/.github/workflows/automation-group-issues.yml@main
    permissions:
      contents: read
    secrets:
      LE_BOT_APP_ID: ${{ secrets.LE_BOT_APP_ID }}
      LE_BOT_PRIVATE_KEY: ${{ secrets.LE_BOT_PRIVATE_KEY }}
  contributor-issue-comment:
    name: Contributor Issue Comment
    if: ${{ github.event_name == 'issue_comment' && github.event.action == 'created' }}
    uses: learningequality/.github/.github/workflows/contributor-issue-comment.yml@main
    permissions:
      contents: read
    secrets:
      LE_BOT_APP_ID: ${{ secrets.LE_BOT_APP_ID }}
      LE_BOT_PRIVATE_KEY: ${{ secrets.LE_BOT_PRIVATE_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_COMMUNITY_NOTIFICATIONS_WEBHOOK_URL: ${{ secrets.SLACK_COMMUNITY_NOTIFICATIONS_WEBHOOK_URL }}
  resolve-bot-pr-threads:
    name: Resolve Bot PR Threads
    if: ${{ github.event_name == 'pull_request_review_comment' }}
    uses: learningequality/.github/.github/workflows/resolve_bot_pr_threads.yml@main
    permissions:
      contents: write
      pull-requests: write
  unassign-inactive-issues:
    name: Unassign Inactive Issues
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    uses: learningequality/.github/.github/workflows/unassign-inactive-issues.yaml@main
    permissions:
      contents: read
    secrets:
      LE_BOT_APP_ID: ${{ secrets.LE_BOT_APP_ID }}
      LE_BOT_PRIVATE_KEY: ${{ secrets.LE_BOT_PRIVATE_KEY }}
      SLACK_COMMUNITY_NOTIFICATIONS_WEBHOOK_URL: ${{ secrets.SLACK_COMMUNITY_NOTIFICATIONS_WEBHOOK_URL }}
