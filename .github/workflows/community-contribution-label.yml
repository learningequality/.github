name: Community Contribution Label
on:
  workflow_call:
    secrets:
      LE_BOT_APP_ID:
        description: 'GitHub App ID for authentication'
        required: true
      LE_BOT_PRIVATE_KEY:
        description: 'GitHub App Private Key for authentication'
        required: true
jobs:
  reusable-job:
    runs-on: ubuntu-latest
    steps:
      - name: Check event context
        run: |
          if [[ "${{ github.event_name }}" != "issues" ]] || [[ "${{ github.event.action }}" != "assigned" && "${{ github.event.action }}" != "unassigned" ]]; then
          echo "This workflow should only run on issue assigned/unassigned events"
          exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: learningequality/.github
          path: .github-repo
      - name: Generate App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.LE_BOT_APP_ID }}
          private-key: ${{ secrets.LE_BOT_PRIVATE_KEY }}
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false
      - name: Add/Remove Community Contribution Label
        run: uv run --project .github-repo --no-dev --locked .github-repo/scripts/community-contribution-label.py
        env:
          token: ${{ steps.generate-token.outputs.token }}
