version: 2
updates:
  # Maintain dependencies for Node
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '00:00'
    cooldown:
      default-days: 7
  # Maintain dependencies for Python
  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '00:00'
    cooldown:
      default-days: 7
  # Maintain dependencies for Github Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '00:00'
    cooldown:
      default-days: 7
    groups:
      github:
        patterns:
          - 'actions/*'
  - package-ecosystem: 'pre-commit'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '00:00'
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns:
          - '*'
